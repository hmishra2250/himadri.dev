<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.m{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.4}.sw{display:grid;gap:6px}.chip{height:64px;border:1px solid var(--hairline)}.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><div class="chip" style="background:var(--pearl)"></div><div style="font-size:13px;font-weight:700">Pearl</div><div class="m">--pearl<br>#f6f7f8</div></div><div class="sw"><div class="chip" style="background:var(--pearl-warm)"></div><div style="font-size:13px;font-weight:700">Pearl warm</div><div class="m">--pearl-warm<br>#edeff1</div></div><div class="sw"><div class="chip" style="background:var(--graphite)"></div><div style="font-size:13px;font-weight:700">Graphite</div><div class="m">--graphite<br>#14232c</div></div><div class="sw"><div class="chip" style="background:var(--graphite-soft)"></div><div style="font-size:13px;font-weight:700">Graphite soft</div><div class="m">--graphite-soft<br>#3d4d56</div></div><div class="sw"><div class="chip" style="background:var(--muted)"></div><div style="font-size:13px;font-weight:700">Muted</div><div class="m">--muted<br>#65737b</div></div></div></body></html>
