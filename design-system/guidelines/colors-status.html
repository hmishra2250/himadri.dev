<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Used sparingly, always with a text label" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.m{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.4}.sw{display:grid;gap:6px}.chip{height:64px;border:1px solid var(--hairline)}.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw"><div class="chip" style="background:var(--status-green)"></div><div style="font-size:13px;font-weight:700">Green</div><div class="m">--status-green<br>#3f7d55</div></div><div class="sw"><div class="chip" style="background:var(--status-warn)"></div><div style="font-size:13px;font-weight:700">Warn</div><div class="m">--status-warn<br>#9b6a11</div></div><div class="sw"><div class="chip" style="background:var(--status-error)"></div><div style="font-size:13px;font-weight:700">Error</div><div class="m">--status-error<br>#a53e3e</div></div><div class="sw"><div class="chip" style="background:var(--status-violet)"></div><div style="font-size:13px;font-weight:700">Violet</div><div class="m">--status-violet<br>#6f5bb1</div></div><div class="sw"><div class="chip" style="background:var(--sage-fill)"></div><div style="font-size:13px;font-weight:700">Sage fill</div><div class="m">--sage-fill<br>137,162,124 / 8%</div></div></div></body></html>
