<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.m{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.4}.sw{display:grid;gap:6px}.chip{height:64px;border:1px solid var(--hairline)}.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><div style="height:64px;border-top:1px solid var(--hairline)"></div><div class="m">--hairline · 18%</div></div>
<div class="sw"><div style="height:64px;border-top:1px solid var(--hairline-strong)"></div><div class="m">--hairline-strong · 32%</div></div>
<div class="sw"><div style="height:64px;border-top:1px solid var(--graphite)"></div><div class="m">--border-rule · graphite</div></div>
<div class="sw"><div style="height:64px;border:1px solid var(--hairline);background:var(--surface-2)"></div><div class="m">--surface-2 · white 34%</div></div></div></body></html>
