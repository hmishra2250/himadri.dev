<!-- @dsCard group="Colors" viewport="700x150" name="Cobalt accent" subtitle="The single accent; dark for text, base for fills" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.m{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.4}.sw{display:grid;gap:6px}.chip{height:64px;border:1px solid var(--hairline)}.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)"><div class="sw"><div class="chip" style="background:var(--cobalt)"></div><div style="font-size:13px;font-weight:700">Cobalt</div><div class="m">--cobalt<br>#2855d8</div></div><div class="sw"><div class="chip" style="background:var(--cobalt-dark)"></div><div style="font-size:13px;font-weight:700">Cobalt dark</div><div class="m">--cobalt-dark<br>#1f43ae</div></div><div class="sw"><div class="chip" style="background:var(--cobalt-press)"></div><div style="font-size:13px;font-weight:700">Cobalt press</div><div class="m">--cobalt-press<br>#18368f</div></div><div class="sw"><div class="chip" style="background:var(--selection)"></div><div style="font-size:13px;font-weight:700">Selection</div><div class="m">--selection<br>rgba 18%</div></div></div></body></html>
