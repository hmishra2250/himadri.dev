<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.m{font-family:var(--font-mono);font-size:11px;color:var(--muted);line-height:1.4}.g{display:grid;gap:12px}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr);gap:16px">
<div><div style="height:60px;border-top:1px solid var(--graphite)"></div><div class="m">1px graphite · section / list start</div></div>
<div><div style="height:60px;border-top:1px solid var(--hairline-strong)"></div><div class="m">hairline-strong · rows</div></div>
<div><div style="height:60px;border-top:2px solid var(--cobalt)"></div><div class="m">2px cobalt · emphasis column</div></div>
<div><div style="height:60px;background:var(--pearl-warm);border-left:2px solid var(--cobalt)"></div><div class="m">callout note</div></div>
<div><div style="height:60px;width:60px;border-radius:4px;background:var(--pearl-warm);outline:1px solid var(--hairline-strong)"></div><div class="m">4px · portrait only</div></div></div></body></html>
